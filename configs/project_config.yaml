project:
  name: ai_air_pollution_episode_forecasting_delhi
  timezone: Asia/Kolkata
  city: Delhi

air_quality:
  preferred_source: cpcb_derived
  fallback_source: openaq
  pollutants:
    - pm25
    - pm10
    - no2
    - o3
    - so2
    - co

weather:
  source: open_meteo_archive
  latitude: 28.6139
  longitude: 77.2090
  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - wind_speed_10m
    - wind_direction_10m
    - pressure_msl
    - precipitation

forecasting:
  horizons_hours:
    - 1
    - 6
    - 12
    - 24

validation:
  split_strategy: chronological
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15

episodes:
  threshold_source: CPCB AQI categories or documented pollutant criteria
  minimum_persistence_hours: 2
